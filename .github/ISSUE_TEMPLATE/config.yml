# Forces issue creators to pick a template, and routes
# security and discussion-style traffic to the right channels.

blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/TBD-org/microtel/security/advisories/new
    about: Please report security vulnerabilities privately, not as public issues. See SECURITY.md.

  - name: Question or design discussion
    url: https://github.com/TBD-org/microtel/discussions
    about: Use GitHub Discussions for questions and design conversations.

  - name: Interface Change Proposal (ICP)
    url: https://github.com/TBD-org/microtel/blob/main/docs/icps/README.md
    about: For breaking changes to locked interfaces, use the ICP process — not an issue.

  - name: Spec
    url: https://github.com/TBD-org/microtel/blob/main/microtel-spec.md
    about: For questions about what's in or out of v1, read the spec first.

  - name: Roadmap
    url: https://github.com/TBD-org/microtel/blob/main/microtel-roadmap.md
    about: For questions about what's coming after v1.0, see the roadmap.

  - name: Contributing
    url: https://github.com/TBD-org/microtel/blob/main/CONTRIBUTING.md
    about: For questions about contributing, see CONTRIBUTING.md.
