#
# Benchmark workflow — runs weekly and on manual dispatch.
# Does NOT run on every PR and does NOT block merge.
#
# Results are uploaded as workflow artifacts and appended to the
# GitHub Actions job summary.  If bench/baseline/results.json is
# committed to the repo, a regression check runs and exits non-zero
# if any SUT regresses by more than REGRESSION_THRESHOLD (default 5%).
#
# To update the baseline: run the workflow on the reference machine,
# download the results.json artifact, copy it to bench/baseline/results.json,
# and commit.

name: benchmark

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: 'Workload profile (default: hot-loop-traces)'
        required: false
        default: 'hot-loop-traces'
      threshold:
        description: 'Regression threshold as a fraction (default: 0.05)'
        required: false
        default: '0.05'
      sink:
        description: 'Sink mode: auto|blackhole|collector (default: auto)'
        required: false
        default: 'auto'

concurrency:
  group: benchmark
  cancel-in-progress: true  # only one benchmark run at a time

env:
  PROFILE:   ${{ github.event.inputs.profile   || 'hot-loop-traces' }}
  THRESHOLD: ${{ github.event.inputs.threshold || '0.05' }}
  SINK:      ${{ github.event.inputs.sink      || 'auto' }}
  OUT_DIR:   ${{ github.workspace }}/bench-results

jobs:
  bench:
    name: Run benchmark harness
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Check Python version
        run: python3 --version

      - name: Run driver unit tests
        working-directory: bench
        run: python3 -m pytest driver/tests/ -q

      - name: Run harness (+ regression check if baseline present)
        working-directory: bench
        run: |
          EXTRA_ARGS=()
          if [ -f "baseline/results.json" ]; then
            EXTRA_ARGS+=(--regression-check baseline/results.json --threshold "$THRESHOLD")
          fi
          python3 -m driver \
            --profile "$PROFILE" \
            --sink    "$SINK" \
            --out     "$OUT_DIR" \
            --allow-smt \
            "${EXTRA_ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: ${{ env.OUT_DIR }}/
          retention-days: 90

      - name: Print summary
        if: always()
        run: |
          if [ -f "$OUT_DIR/results.md" ]; then
            cat "$OUT_DIR/results.md" >> "$GITHUB_STEP_SUMMARY"
          fi
