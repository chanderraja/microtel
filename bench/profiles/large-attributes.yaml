# large-attributes — B1 profile
#
# Spans with 20 attributes, mean 256 bytes each, including some 4 KB
# string attributes.  Measures encoding cost on big payloads and exercises
# the attribute_value_length_limit truncation path (spec §5.6).
#
# The driver injects EMIT_ATTRIBUTES_PER_SPAN and EMIT_ATTRIBUTE_VALUE_BYTES
# into each SUT container; the emit-app pre-builds the attribute key vector
# and value string in Init() so the hot path stays allocation-free.

profile: large-attributes
description: "20×256-byte attributes per span — encoding cost and wire bytes"

workload:
  mode: hot_loop
  spans_per_sample: 5000   # fewer than hot-loop-traces; encoding adds overhead
  samples: 10
  warmup_spans: 500

sink:
  mode: blackhole
  protocol: auto

# Profile-level env vars injected into every SUT container for this run.
env:
  EMIT_ATTRIBUTES_PER_SPAN: "20"
  EMIT_ATTRIBUTE_VALUE_BYTES: "256"

suts:
  - microtel
  - otelcpp-grpc
  - otelcpp-http

metrics:
  - spans_emitted
  - spans_dropped
  - duration_ns
  - latency_p50_ns
  - latency_p95_ns
  - latency_p99_ns
  - latency_min_ns
  - latency_max_ns
