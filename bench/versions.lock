schema_version: 1
# Documentation-only registry of the externally pinned versions in the bench
# harness. Nothing reads this file — not bench.sh, not any Dockerfile, not CI.
# The real pins live in the Dockerfiles; the values here are a human-readable
# index of them, so changing one here alone changes nothing. Update both.
#
# (An earlier version of this comment claimed bench.sh read the file and passed
# --build-arg from it. It does not, and never has.)

# OS base image used by all SUT stages.
ubuntu_image: "ubuntu:24.04"

# C++ toolchain pinned across all SUTs. Ubuntu 24.04 ships clang-18 in its
# default apt repositories; no LLVM overlay needed.
clang_version: "18"

# opentelemetry-cpp release tag used for the otelcpp-grpc and otelcpp-http SUTs.
# Dockerfile receives this as --build-arg OTELCPP_VERSION.
otelcpp_version: "v1.19.0"

# Go toolchain version for blackhole-sink (matches bench/sink/blackhole/go.mod).
go_version: "1.25"

# otel-collector image for sink/collector mode (B2+; not used in B0).
# Kept in step with ci/scripts/conformance.sh and docs/interop-matrix.md so the
# bench and the conformance gate measure the same receiver.
otelcol_image: "otel/opentelemetry-collector-contrib:0.160.0"
