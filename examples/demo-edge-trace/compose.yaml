#
# Linux-to-microcontroller tracing demo. One command:
#
#   docker compose up --build
#
# then open http://localhost:3000 (Grafana -> Explore -> Tempo). The
# collector, Tempo and Grafana configuration is shared with examples/stack/.

name: microtel-edge-demo

services:
  # Cortex-M4 firmware (microtel leaf, C11) on QEMU mps2-an386.
  device:
    build:
      context: ../..
      dockerfile: examples/demo-edge-trace/docker/device.Dockerfile

  # Linux service (microtel C++ SDK) + concentrator for the device.
  gateway:
    build:
      context: ../..
      dockerfile: examples/demo-edge-trace/docker/gateway.Dockerfile
    environment:
      DEVICE_ADDR: "device:5555"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      CYCLES: "${CYCLES:-0}"
      INTERVAL_MS: "${INTERVAL_MS:-5000}"
    depends_on:
      - device
      - otel-collector

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../stack/collector-config.yaml:/etc/otelcol/config.yaml:ro,z
    depends_on:
      - tempo

  tempo:
    image: docker.io/grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../stack/tempo.yaml:/etc/tempo/tempo.yaml:ro,z
    ports:
      - "3200:3200"

  grafana:
    image: docker.io/grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/microtel-traces.json"
    volumes:
      - ../stack/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,z
      - ../stack/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,z
      - ../stack/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    ports:
      - "3000:3000"
    depends_on:
      - tempo
