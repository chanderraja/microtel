# examples/leaf_mqtt/mosquitto.conf: the demo broker.
#
# Plaintext and anonymous, which is acceptable only because mqtt-compose.yaml
# publishes the port on 127.0.0.1 alone. Never copy this to anything
# reachable. README.md, "Real deployments", has what a real broker needs: TLS
# on 8883, per-device credentials, and an ACL that ties each device to its own
# topic.

listener 1883
allow_anonymous true

# Nothing to keep between runs: every session in the example is clean.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
