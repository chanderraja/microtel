# microtel — SonarQube Cloud configuration
#
# Authority: this file is the project's SonarQube scan configuration.
# When this file disagrees with docs/coding-standards.md §13 (SonarQube
# ruleset), the standards document wins — open a PR fixing this file.
#
# Setup checklist (one-time, during M2):
#   1. Sign up at sonarcloud.io with the GitHub account owning the repo.
#   2. Import the microtel repo as a SonarQube Cloud project (OSS tier;
#      free for public repositories with no LOC cap).
#   3. The organization and project keys below match the SonarCloud project
#      with the values shown in SonarQube Cloud's project settings.
#   4. Generate a user token in SonarQube Cloud → Account → Security.
#   5. Add the token as `SONAR_TOKEN` in GitHub repo secrets.
#   6. Verify the Quality Gate is set to "Sonar way" (default) or a
#      project-specific gate; document any deviations here.
#
# Reference: https://docs.sonarsource.com/sonarqube-cloud/

# ============================================================
# Project identity
# ============================================================

sonar.projectKey=chanderraja_microtel
sonar.organization=chanderraja
sonar.projectName=microtel
sonar.projectDescription=Lightweight OpenTelemetry-compatible trace runtime and OTLP exporter built on nghttp2

# Version is taken from CMake's configured project version at scan time.
# CI overrides this with `-Dsonar.projectVersion=<version>`.
sonar.projectVersion=0.0.0-pre

# ============================================================
# Source layout
# ============================================================

# Sources: production code and public headers.
sonar.sources=src,include

# Test code lives separately so test patterns and coverage rules apply
# only to non-test sources.
sonar.tests=tests

# Both production and test code are C++.
# (SonarQube auto-detects, but explicit is better.)
sonar.cfamily.compile-commands=build/coverage/compile_commands.json

# Encoding (every source file is UTF-8 per editor config).
sonar.sourceEncoding=UTF-8

# ============================================================
# Exclusions: what NOT to analyze
# ============================================================

# Generated upb code (committed under gen/ but produced from proto/).
# Sonar findings on generated code are noise — fix the generator, not
# the output.
#
# `build*/**` (rather than the narrower `build/**` + `build-*/**` it replaces)
# covers every build directory this repo's scripts and docs create:
# `build/`, `build/coverage`, `build-asan/`, `builds/`. A build tree that
# escapes this pattern gets scanned as source, and FetchContent output under
# `_deps/` is exactly the vendored code these exclusions exist to keep out.
sonar.exclusions=\
    gen/**,\
    **/third_party/**,\
    **/_deps/**,\
    proto/**,\
    build*/**,\
    spike/**,\
    examples/**/build/**,\
    python/build/**,\
    python/dist/**,\
    **/*.upb.c,\
    **/*.upb.h,\
    **/*.upb_minitable.c,\
    **/*.upb_minitable.h,\
    **/_generated/**

# Coverage exclusions — code that exists but shouldn't count toward
# coverage thresholds (interfaces with no implementation, examples,
# generated code already excluded above).
sonar.coverage.exclusions=\
    include/microtel/internal/**,\
    examples/**,\
    tests/**,\
    **/main.cpp

# CPD (copy-paste detection) exclusions — generated code, tests where
# duplication is sometimes intentional (parameterized test fixtures).
sonar.cpd.exclusions=\
    gen/**,\
    **/third_party/**,\
    tests/**

# ============================================================
# Test inclusions
# ============================================================

# Patterns matching test files within sonar.tests.
sonar.test.inclusions=\
    tests/**/*_test.cpp,\
    tests/**/*_test.hpp,\
    tests/**/test_*.cpp,\
    tests/**/test_*.hpp

# ============================================================
# Coverage report integration
# ============================================================

# Coverage is generated by ci/scripts/coverage.sh, which calls lcov to
# capture gcov output and writes the filtered (microtel-owned-only)
# tracefile at build/coverage/coverage.filtered.info. That tracefile is
# then converted to SonarQube's language-agnostic generic coverage XML by
# ci/scripts/lcov-to-sonar.py and imported through the key below.
#
# This file previously claimed that "SonarCloud's cfamily analyzer accepts
# any lcov-format `.info` file via the `llvm-cov.reportPath` key — the name
# is historical, the format is what matters." That claim was false, and it
# cost the project its coverage measurement (issue #211): the llvm-cov
# sensor opened the lcov tracefile, recognised nothing in it, and imported
# zero records **without a warning**, so the whole project read 0.0%
# coverage while coverage.sh measured ~91% on the same bytes. The second
# half of the same bug was that `lcov --capture --directory` writes
# absolute `SF:` paths, which do not match the repo-relative keys SonarQube
# indexes files under.
#
# The generic format removes both failure modes: it is imported by a
# language-agnostic sensor (not cfamily), and the converter rebases every
# path to repo-relative. The converter exits non-zero rather than writing
# an empty report, so a silent zero cannot recur unnoticed.
#
# Reference:
# https://docs.sonarsource.com/sonarqube-cloud/enriching/test-coverage/generic-test-data/
sonar.coverageReportPaths=build/coverage/sonar-coverage.xml

# ============================================================
# C++ analyzer (cfamily) tuning
# ============================================================

# Cache analyzer artifacts for faster rescans on PRs.
sonar.cfamily.cache.enabled=true
sonar.cfamily.cache.path=.sonar/cache

# C++ standard — matches CMakeLists.txt CXX_STANDARD.
# (cfamily auto-detects from compile_commands.json; this is documentation.)
sonar.cfamily.cpp.standard=20

# ============================================================
# Quality gate
# ============================================================

# Use the project's configured quality gate (default: "Sonar way").
# To enforce a custom gate, configure it in SonarQube Cloud UI and
# reference it by name here. Pre-1.0 we use the default; v1.0 release
# gates per spec §13.5 are enforced separately by other CI jobs.

# ============================================================
# PR decoration
# ============================================================

# SonarQube Cloud picks up GitHub PR metadata automatically when run
# from a `pull_request` workflow trigger — no extra config needed.
# The scan-action workflow (.github/workflows/sonarqube.yml) handles
# this end-to-end.

# ============================================================
# Severity overrides
# ============================================================
#
# These are documented in docs/coding-standards.md §13 and applied
# through SonarQube Cloud's "Quality Profile" UI rather than this file
# (the .properties file does not override per-rule severities).
#
# Profile name: "microtel-cpp" (forked from "Sonar way" for C++).
# Adjustments:
#   - Severity raised to Critical:
#       * cpp:S1006   complexity-over-limit
#       * cpp:S5715   banned-function-use (custom rule)
#       * cpp:S5025   raw-new-or-delete-in-production
#   - Severity lowered to Info:
#       * cpp:S1845   doxygen-comment-on-private-method
#       * cpp:S1116   blank-line-after-brace
#   - Disabled:
#       * cpp:S5567   RTTI-tags (we don't use RTTI in production code)
#
# When the profile is updated, mirror the change in coding-standards.md §13.

# ============================================================
# Notes for maintainers
# ============================================================
#
# Adding a new exclusion: prefer to scope it tightly. Add a comment
# explaining why. Periodically audit `sonar.exclusions` — exclusions
# tend to accumulate.
#
# Updating the analyzer: SonarQube Cloud manages the C++ analyzer
# version. No action needed locally.
#
# When the v2.0 leaf library lands, this file will get a sibling
# (sonar-leaf-project.properties) configured for C99 instead of C++20.
